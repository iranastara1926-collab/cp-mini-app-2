<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CP Mini App</title>

  <script src="https://telegram.org/js/telegram-web-app.js"></script>

  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      font-family: Arial, sans-serif;
      background: #0b0b16;
      color: white;
    }

    .app {
      width: 85%;
      max-width: 380px;
      padding: 30px 20px;
      text-align: center;
      background: #17172a;
      border-radius: 25px;
      box-shadow: 0 10px 40px #000;
    }

    h1 {
      font-size: 32px;
    }

    #user {
      color: #aaa;
      margin: 15px 0;
    }

    #balance {
      font-size: 42px;
      font-weight: bold;
      margin: 25px 0;
    }

    button {
      width: 100%;
      padding: 18px;
      border: none;
      border-radius: 15px;
      font-size: 20px;
      font-weight: bold;
      color: white;
      background: #665cff;
    }
  </style>
</head>

<body>

  <div class="app">

    <h1>🎮 CP</h1>

    <div id="user">در حال شناسایی کاربر...</div>

    <p>موجودی شما</p>

    <div id="balance">0 CP</div>

    <button id="claim">⚡ دریافت CP</button>

  </div>

  <script>
    const tg = window.Telegram.WebApp;

    tg.ready();
    tg.expand();

    const user = tg.initDataUnsafe.user;

    if (user) {
      document.getElementById("user").textContent =
        "سلام " + user.first_name + " 👋";
    } else {
      document.getElementById("user").textContent =
        "کاربر تلگرام شناسایی نشد";
    }

    let cp = 0;

    document.getElementById("claim").addEventListener("click", function () {
      cp = cp + 1;
      document.getElementById("balance").textContent = cp + " CP";
    });
  </script>

</body>
</html>
