<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>CP Mini App</title>

<script src="https://telegram.org/js/telegram-web-app.js"></script>

<style>
*{
  box-sizing:border-box;
}

body{
  margin:0;
  color:#fff;
  font-family:Arial,Tahoma,sans-serif;
  background:
    radial-gradient(circle at 50% 0%,#292929 0%,#0b0b0b 42%,#020202 100%);
  padding-bottom:95px;
}

.app{
  width:100%;
  max-width:520px;
  margin:auto;
  padding:16px;
}

.page{
  display:none;
}

.page.active{
  display:block;
}


/* ================= HEADER ================= */

.top-header{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-bottom:25px;
}

.logo{
  font-size:22px;
  font-weight:800;
  letter-spacing:.5px;
}

.top-cp{
  background:linear-gradient(135deg,#292929,#111);
  border:1px solid #5b4818;
  border-radius:14px;
  padding:8px 12px;
  box-shadow:0 0 18px rgba(218,172,48,.15);
  text-align:right;
}

.top-cp-label{
  color:#999;
  font-size:9px;
  text-transform:uppercase;
}

.top-cp-value{
  color:#e7bb45;
  font-size:17px;
  font-weight:800;
}


/* ================= MINE ================= */

.mine-card{
  text-align:center;
  padding-top:5px;
}

.mine-sub{
  color:#888;
  font-size:12px;
  margin-bottom:22px;
}


/* Beautiful CP circle */

.cp-wrapper{
  position:relative;
  width:270px;
  height:270px;
  margin:0 auto 18px;
  display:flex;
  justify-content:center;
  align-items:center;
}

.cp-glow{
  position:absolute;
  width:245px;
  height:245px;
  border-radius:50%;
  background:#d6a92f;
  opacity:.12;
  filter:blur(28px);
  animation:pulse 2.5s infinite;
}

@keyframes pulse{
  0%,100%{
    transform:scale(.95);
    opacity:.10;
  }

  50%{
    transform:scale(1.08);
    opacity:.20;
  }
}

.cp-circle{
  position:relative;
  width:225px;
  height:225px;
  border-radius:50%;

  background:
    radial-gradient(
      circle at 32% 23%,
      #555 0%,
      #292929 18%,
      #111 48%,
      #030303 82%
    );

  border:7px solid #d6a92f;

  box-shadow:
    0 0 0 4px #080808,
    0 0 0 7px #9d7920,
    0 0 35px rgba(214,169,47,.38),
    inset 0 0 35px rgba(255,255,255,.06),
    inset 0 -20px 35px rgba(0,0,0,.75);

  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;

  cursor:pointer;
  user-select:none;

  transition:
    transform .12s,
    filter .2s;
}

.cp-circle:before{
  content:"";
  position:absolute;
  top:14px;
  left:35px;
  width:70px;
  height:28px;
  border-radius:50%;
  background:rgba(255,255,255,.08);
  transform:rotate(-25deg);
  filter:blur(4px);
}

.cp-circle:active{
  transform:scale(.94);
  filter:brightness(1.25);
}

.cp-icon{
  font-size:25px;
  margin-bottom:4px;
  filter:drop-shadow(0 0 8px rgba(226,182,60,.55));
}

.cp-title{
  color:#e2b43e;
  font-size:14px;
  font-weight:800;
  letter-spacing:1px;
}

.cp-number{
  font-size:43px;
  font-weight:900;
  line-height:1.1;
  margin:7px 0;
}

.cp-text{
  color:#888;
  font-size:10px;
}


/* mining amount */

.mining-bubble{
  position:absolute;
  top:25px;
  right:15px;

  color:#e8bd48;
  font-size:22px;
  font-weight:900;

  opacity:0;
  pointer-events:none;
}

.mining-bubble.show{
  animation:floatUp .75s ease-out;
}

@keyframes floatUp{
  0%{
    opacity:0;
    transform:translateY(15px) scale(.7);
  }

  25%{
    opacity:1;
  }

  100%{
    opacity:0;
    transform:translateY(-55px) scale(1.15);
  }
}


/* ================= CAPACITY ================= */

.capacity-box{
  width:100%;
  max-width:320px;
  margin:0 auto;
}

.capacity-text{
  display:flex;
  justify-content:space-between;
  color:#aaa;
  font-size:12px;
  margin-bottom:8px;
}

.capacity-text b{
  color:#e2b43e;
}

.capacity-bar{
  width:100%;
  height:9px;
  border-radius:20px;
  background:#242424;
  overflow:hidden;
  border:1px solid #333;
}

.capacity-fill{
  height:100%;
  width:100%;
  border-radius:20px;
  background:linear-gradient(90deg,#9c741
