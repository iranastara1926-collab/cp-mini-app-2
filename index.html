<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CP Mini App</title>
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      font-family: Arial, sans-serif;
      background: #0b0b16;
      color: white;
    }

    .app {
      width: 85%;
      max-width: 380px;
      padding: 30px 20px;
      text-align: center;
      background: #17172a;
      border-radius: 25px;
    }

    #balance {
      font-size: 42px;
      font-weight: bold;
      margin: 25px 0;
    }

    button {
      width: 100%;
      padding: 18px;
      border: none;
      border-radius: 15px;
      font-size: 20px;
      font-weight: bold;
      color: white;
      background: #665cff;
    }
  </style>
</head>

<body>
  <div class="app">
    <h1>🎮 CP</h1>
    <p>موجودی شما</p>

    <div id="balance">0 CP</div>

    <button id="claim">⚡ دریافت CP</button>
  </div>

  <script>
    let cp = 0;

    document.getElementById("claim").onclick = function () {
      cp++;
      document.getElementById("balance").innerText = cp + " CP";
    };
  </script>
</body>
</html>
