<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CP Mini App</title>

<style>
*{
  box-sizing:border-box;
  -webkit-tap-highlight-color:transparent;
}

body{
  margin:0;
  background:
    radial-gradient(circle at 50% 0%,#292929 0%,#0b0b0b 42%,#020202 100%);
  color:#fff;
  font-family:Arial,Tahoma,sans-serif;
  padding-bottom:90px;
}

.app{
  width:100%;
  max-width:520px;
  margin:auto;
  padding:15px;
}

.page{
  display:none;
}

.page.active{
  display:block;
}

/* TOP */

.top{
  display:flex;
  align-items:center;
  justify-content:space-between;
  margin-bottom:22px;
}

.logo{
  font-size:23px;
  font-weight:900;
}

.total-cp{
  background:#111;
  border:1px solid #80631d;
  border-radius:14px;
  padding:7px 12px;
  text-align:right;
}

.total-cp small{
  display:block;
  color:#777;
  font-size:9px;
}

.total-cp b{
  color:#e6b93f;
  font-size:17px;
}


/* MINE */

.mine-title{
  text-align:center;
  color:#888;
  font-size:12px;
  margin-bottom:20px;
}

.circle-wrap{
  position:relative;
  width:280px;
  height:280px;
  margin:auto;
  display:flex;
  align-items:center;
  justify-content:center;
}

.glow{
  position:absolute;
  width:250px;
  height:250px;
  border-radius:50%;
  background:#d8ad35;
  opacity:.13;
  filter:blur(28px);
  animation:glow 2.5s infinite;
}

@keyframes glow{
  0%,100%{
    transform:scale(.95);
  }
  50%{
    transform:scale(1.08);
  }
}

.mine-circle{
  position:relative;
  width:225px;
  height:225px;
  border-radius:50%;

  background:
    radial-gradient(
      circle at 32% 22%,
      #555 0%,
      #292929 20%,
      #111 52%,
      #030303 85%
    );

  border:7px solid #d8aa32;

  box-shadow:
    0 0 0 4px #080808,
    0 0 0 7px #916e1b,
    0 0 38px rgba(220,176,55,.42),
    inset 0 0 35px rgba(255,255,255,.05),
    inset 0 -25px 40px rgba(0,0,0,.8);

  display:flex;
  align-items:center;
  justify-content:center;
  flex-direction:column;

  cursor:pointer;
  user-select:none;

  transition:.12s;
}
