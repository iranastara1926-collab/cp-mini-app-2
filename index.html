<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Arshan Coin</title>

<style>
*{
    box-sizing:border-box;
    -webkit-tap-highlight-color:transparent;
}

body{
    margin:0;
    min-height:100vh;
    background:
        radial-gradient(circle at 50% 0%, #252525 0%, #0b0b0b 45%, #000 100%);
    color:#fff;
    font-family:Arial,Tahoma,sans-serif;
}

.app{
    width:100%;
    max-width:500px;
    min-height:100vh;
    margin:auto;
    padding:24px 16px 35px;
    text-align:center;
}

.logo{
    font-size:28px;
    font-weight:900;
    letter-spacing:1px;
}

.subtitle{
    color:#999;
    font-size:13px;
    margin-top:5px;
}

/* BALANCE */

.balance{
    width:210px;
    margin:22px auto 15px;
    padding:13px 20px;
    background:rgba(255,255,255,.045);
    border:1px solid #333;
    border-radius:18px;
}

.balance-title{
    color:#999;
    font-size:12px;
}

.balance-number{
    margin-top:4px;
    font-size:29px;
    font-weight:900;
}

/* LEVEL */

.level-box{
    max-width:370px;
    margin:0 auto 20px;
    text-align:left;
}

.level-row{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-bottom:7px;
    color:#ccc;
    font-size:13px;
}

.level-number{
    color:#e4b933;
    font-weight:900;
}

.level-bar{
    height:10px;
    background:#222;
    border:1px solid #333;
    border-radius:20px;
    overflow:hidden;
}

.level-fill{
    height:100%;
    width:0%;
    background:linear-gradient(
        90deg,
        #8b620c,
        #d4af37,
        #ffe58a
    );
    transition:width .25s ease;
}

/* COIN */

.coin{
    width:225px;
    height:225px;
    margin:15px auto 22px;

    border-radius:50%;

    border:3px solid #d4af37;

    background:
        radial-gradient(
            circle at 30% 22%,
            #3d3d3d 0%,
            #191919 35%,
            #080808 70%,
            #000 100%
        );

    box-shadow:
        0 0 0 5px #050505,
        0 0 0 8px #8d6a1b,
        0 0 35px rgba(212,175,55,.35),
        0 18px 55px rgba(0,0,0,.9),
        inset 0 0 30px rgba(212,175,55,.16);

    display:flex;
    flex-direction:column;
    justify-content:center;
    align-items:center;

    position:relative;
    overflow:hidden;

    cursor:pointer;
    user-select:none;

    transition:
        transform .08s ease,
        box-shadow .15s ease;
}

.coin::before{
    content:"";
    position:absolute;
    inset:14px;

    border-radius:50%;
    border:1px solid rgba(212,175,55,.65);

    box-shadow:
        inset 0 0 20px rgba(212,175,55,.12);
}

.coin::after{
    content:"";
    position:absolute;
    width:90px;
    height:35px;
    top:32px;
    left:45px;

    border-radius:50%;
    background:rgba(255,255,255,.09);

    transform:rotate(-25deg);
    filter:blur(8px);
}

.coin:active{
    transform:scale(.93);
    box-shadow:
        0 0 0 5px #050505,
        0 0 0 8px #d4af37,
        0 0 45px rgba(212,175,55,.55),
        0 12px 35px rgba(0,0,0,.9),
        inset 0 0 30px rgba(212,175,55,.2);
}

.coin-name{
    position:relative;
    z-index:2;

    color:#d4af37;
    font-size:23px;
    font-weight:1000;
    letter-spacing:3px;

    text-shadow:
        0 0 8px rgba(212,175,55,.55),
        0 2px 5px #000;
}

.coin-cp{
    position:relative;
    z-index:2;

    margin:7px 0;

    color:#f1d36a;
    font-size:54px;
    line-height:1;
    font-weight:1000;
    letter-spacing:4px;

    text-shadow:
        0 0 13px rgba(212,175,55,.6),
        0 3px 7px #000;
}

.coin-tap{
    position:relative;
    z-index:2;

    color:#aaa;
    font-size:11px;
    letter-spacing:1px;
}

/* CAPACITY */

.capacity{
    max-width:370px;
    margin:auto;
}

.capacity-row{
    display:flex;
    justify-content:space-between;

    color:#ddd;
    font-size:14px;

    margin-bottom:8px;
}

.capacity-bar{
    width:100%;
    height:13px;

    background:#202020;
    border:1px solid #333;
    border-radius:20px;

    overflow:hidden;
}

.capacity-fill{
    width:100%;
    height:100%;

    background:
        linear-gradient(
            90deg,
            #8d620c,
            #d4af37,
            #ffe083
        );

    transition:width .15s ease;
}

.timer{
    min-height:18px;
    margin-top:8px;

    color:#d4af37;
    font-size:12px;
}

/* SHOP */

.shop{
    margin-top:32px;
    text-align:left;
}

.section-title{
    font-size:21px;
    font-weight:900;
    margin-bottom:12px;
}

.card{
    padding:16px;
    margin-bottom:11px;

    background:
        linear-gradient(
            145deg,
            #181818,
            #0b0b0b
        );

    border:1px solid #303030;
    border-radius:17px;
}

.card-title{
    font-size:16px;
    font-weight:900;
}

.card-description{
    margin-top:6px;

    color:#999;
    font-size:12px;
    line-height:1.6;
}

.buy-button{
    width:100%;

    margin-top:13px;
    padding:12px;

    border:0;
    border-radius:12px;

    background:
        linear-gradient(
            135deg,
            #f0c744,
            #966400
        );

    color:#111;
    font-weight:900;

    cursor:pointer;
}

.buy-button:active{
    transform:scale(.97);
}

/* NAVIGATION */

.navigation{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:9px;

    margin-top:25px;
}

.nav-button{
    min-height:68px;

    background:#111;
    border:1px solid #333;
    border-radius:16px;

    color:#fff;
    font-weight:900;

    cursor:pointer;
}

.nav-button span{
    display:block;
    font-size:23px;
    margin-bottom:5px;
}

.nav-button:active{
    transform:scale(.96);
}

/* POPUP */

.pop{
    position:fixed;

    pointer-events:none;

    color:#ffd84c;
    font-size:22px;
    font-weight:900;

    z-index:999;

    animation:popAnimation .7s ease-out forwards;
}

@keyframes popAnimation{

    0%{
        opacity:1;
        transform:translateY(0) scale(1);
    }

    100%{
        opacity:0;
        transform:translateY(-75px) scale(1.3);
    }
}

@media(max-width:380px){

    .coin{
        width:190px;
        height:190px;
    }

    .coin-cp{
        font-size:45px;
    }
}
</style>
</head>

<body>

<div class="app">

    <div class="logo">
        🪙 ARSHAN COIN
    </div>

    <div class="subtitle">
        CP Mining System
    </div>


    <!-- BALANCE -->

    <div class="balance">

        <div class="balance-title">
            YOUR BALANCE
        </div>

        <div class="balance-number">
            <span id="balance">0</span> CP
        </div>

    </div>


    <!-- LEVEL -->

    <div class="level-box">

        <div class="level-row">

            <span class="level-number">
                LEVEL <span id="level">1</span>
            </span>

            <span id="levelProgress">
                0 / 15,000
            </span>

        </div>

        <div class="level-bar">

            <div
                class="level-fill"
                id="levelFill">
            </div>

        </div>

    </div>


    <!-- COIN -->

    <div
        class="coin"
        id="coin"
    >

        <div class="coin-name">
            ARSHAN
        </div>

        <div class="coin-cp">
            CP
        </div>

        <div class="coin-tap">
            TAP TO COLLECT
        </div>

    </div>


    <!-- CAPACITY -->

    <div class="capacity">

        <div class="capacity-row">

            <span>
                MINING CAPACITY
            </span>

            <span>
                <b id="energy">1000</b>
                /
                <b id="maxEnergy">1000</b>
            </span>

        </div>

        <div class="capacity-bar">

            <div
                class="capacity-fill"
                id="capacityFill">
            </div>

        </div>

        <div
            class="timer"
            id="timer">
        </div>

    </div>


    <!-- SHOP -->

    <div
        class="shop"
        id="shop"
    >

        <div class="section-title">
            🛒 SHOP
        </div>


        <div class="card">

            <div class="card-title">
                ⚡ CAPACITY BOOST
            </div>

            <div class="card-description">
                Increase your maximum mining capacity by 500.
            </div>

            <button
                class="buy-button"
                onclick="buyBoost()"
            >
                BUY BOOST
            </button>

        </div>

    </div>


    <!-- NAVIGATION -->

    <div class="navigation">

        <button
            class="nav-button"
            onclick="goMiner()"
        >
            <span>⛏️</span>
            MINER
        </button>


        <button
            class="nav-button"
            onclick="goShop()"
        >
            <span>🛒</span>
            SHOP
        </button>


        <button
            class="nav-button"
            onclick="goExchange()"
        >
            <span>💱</span>
            EXCHANGE
        </button>

    </div>

</div>


<script>

/*
========================================
ARSHAN COIN DATA
========================================
*/

const STORAGE_KEY =
    "arshan_coin_final_v1";


let data =
    JSON.parse(
        localStorage.getItem(STORAGE_KEY)
    );


/*
========================================
NEW USER
========================================
*/

if(!data){

    data = {

        balance: 0,

        level: 1,

        energy: 1000,

        maxEnergy: 1000,

        rechargeStart: null

    };

    saveData();
}


/*
========================================
ELEMENTS
========================================
*/

const balanceElement =
    document.getElementById("balance");

const levelElement =
    document.getElementById("level");

const levelProgressElement =
    document.getElementById("levelProgress");

const levelFillElement =
    document.getElementById("levelFill");

const energyElement =
    document.getElementById("energy");

const maxEnergyElement =
    document.getElementById("maxEnergy");

const capacityFillElement =
    document.getElementById("capacityFill");

const timerElement =
    document.getElementById("timer");

const coinElement =
    document.getElementById("coin");


/*
========================================
SAVE
========================================
*/

function saveData(){

    localStorage.setItem(
        STORAGE_KEY,
        JSON.stringify(data)
    );

}


/*
========================================
LEVEL REQUIREMENTS
========================================

LEVEL 1 = 0
LEVEL 2 = 15,000
LEVEL 3 = 40,000
LEVEL 4 = 65,000
LEVEL 5 = 90,000
...

After Level 3:
+25,000 CP per level
========================================
*/

function requiredCP(level){

    if(level <= 1){
        return 0;
    }

    if(level === 2){
        return 15000;
    }

    if(level === 3){
        return 40000;
    }

    return 40000 +
        ((level - 3) * 25000);

}


/*
========================================
CALCULATE LEVEL
========================================
*/

function calculateLevel(){

    let calculatedLevel = 1;


    while(
        data.balance >=
        requiredCP(calculatedLevel + 1)
    ){

        calculatedLevel++;


        if(calculatedLevel >= 100){
            break;
        }

    }


    /*
    If user levels up,
    every new level gives +500 capacity.
    */

    if(calculatedLevel > data.level){

        const levelsGained =
            calculatedLevel - data.level;


        data.maxEnergy +=
            levelsGained * 500;


        data.energy +=
            levelsGained * 500;

    }


    data.level =
        calculatedLevel;

}


/*
========================================
UPDATE UI
========================================
*/

function updateUI(){

    calculateLevel();


    balanceElement.textContent =
        data.balance.toLocaleString("en-US");


    levelElement.textContent =
        data.level;


    energyElement.textContent =
        data.energy.toLocaleString("en-US");


    maxEnergyElement.textContent =
        data.maxEnergy.toLocaleString("en-US");


    /*
    LEVEL PROGRESS
    */

    const currentRequirement =
        requiredCP(data.level);


    const nextRequirement =
        requiredCP(data.level + 1);


    const levelRange =
        nextRequirement -
        currentRequirement;


    let progress =
        (
            (data.balance - currentRequirement)
            /
            levelRange
        ) * 100;


    if(progress < 0){
        progress = 0;
    }


    if(progress > 100){
        progress = 100;
    }


    levelFillElement.style.width =
        progress + "%";


    levelProgressElement.textContent =
        data.balance.toLocaleString("en-US")
        +
        " / "
        +
        nextRequirement.toLocaleString("en-US");


    /*
    CAPACITY
    */

    let capacityPercent =
        (
            data.energy /
            data.maxEnergy
        ) * 100;


    if(capacityPercent < 0){
        capacityPercent = 0;
    }


    if(capacityPercent > 100){
        capacityPercent = 100;
    }


    capacityFillElement.style.width =
        capacityPercent + "%";


    updateRecharge();


    saveData();

}


/*
========================================
COLLECT CP
========================================
*/

function collectCP(event){

    if(data.energy <= 0){

        return;

    }


    data.energy -= 1;

    data.balance += 1;


    /*
    Start recharge timer
    when capacity reaches zero.
    */

    if(data.energy === 0){

        data.rechargeStart =
            Date.now();

    }


    showPopup(event);

    updateUI();

}


/*
========================================
POPUP +1 CP
========================================
*/

function showPopup(event){

    const popup =
        document.createElement("div");


    popup.className =
        "pop";


    popup.textContent =
        "+1 CP";


    let x =
        window.innerWidth / 2;


    let y =
        window.innerHeight / 2;


    if(event){

        if(event.clientX){
            x = event.clientX;
        }

        if(event.clientY){
            y = event.clientY;
        }

    }


    popup.style.left =
        x + "px";


    popup.style.top =
        y + "px";


    document.body.appendChild(
        popup
    );


    setTimeout(
        function(){

            popup.remove();

        },
        700
    );

}


/*
========================================
RECHARGE
========================================

When capacity reaches zero,
it becomes full after 1 hour.
========================================
*/

function updateRecharge(){

    if(
        data.energy >= data.maxEnergy
        ||
        !data.rechargeStart
    ){

        timerElement.textContent =
            "";

        return;

    }


    const ONE_HOUR =
        60 * 60 * 1000;


    const elapsed =
        Date.now() -
        data.rechargeStart;


    const remaining =
        ONE_HOUR -
        elapsed;


    if(remaining <= 0){

        data.energy =
            data.maxEnergy;


        data.rechargeStart =
            null;


        saveData();


        updateUI();


        return;

    }


    const minutes =
        Math.floor(
            remaining / 60000
        );


    const seconds =
        Math.floor(
            (remaining % 60000) / 1000
        );


    timerElement.textContent =
        "RECHARGE IN "
        +
        String(minutes)
            .padStart(2,"0")
        +
        ":"
        +
        String(seconds)
            .padStart(2,"0");

}


/*
========================================
BOOST
========================================

Temporary testing version.
Later we can connect
this to a real purchase system.
========================================
*/

function buyBoost(){

    data.maxEnergy += 500;

    data.energy += 500;

    updateUI();


    alert(
        "BOOST ACTIVATED!\n\n"
        +
        "New capacity: "
        +
        data.maxEnergy
    );

}


/*
========================================
NAVIGATION
========================================
*/

function goMiner(){

    window.scrollTo({
        top:0,
        behavior:"smooth"
    });

}


function goShop(){

    document
        .getElementById("shop")
        .scrollIntoView({
            behavior:"smooth"
        });

}


function goExchange(){

    alert(
        "EXCHANGE\n\n"
        +
        "Exchange connection will be available soon."
    );

}


/*
========================================
COIN CLICK
========================================
*/

coinElement.addEventListener(
    "click",
    collectCP
);


/*
========================================
RECHARGE TIMER
========================================
*/

setInterval(
    updateRecharge,
    1000
);


/*
========================================
START
========================================
*/

updateUI();

</script>

</body>
</html>
