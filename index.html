<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>CP Mine</title>

<style>
body{
    margin:0;
    background:#050505;
    color:white;
    font-family:Arial,sans-serif;
    text-align:center;
}

h2{
    margin-top:25px;
}

#cp{
    color:#e5b83f;
}

.circle{
    width:220px;
    height:220px;
    border-radius:50%;
    margin:70px auto 25px;

    background:radial-gradient(
        circle at 35% 25%,
        #555,
        #222 35%,
        #050505 75%
    );

    border:7px solid #d7aa35;

    box-shadow:
        0 0 20px #d7aa35,
        0 0 50px rgba(215,170,53,.35);

    display:flex;
    flex-direction:column;
    justify-content:center;
    align-items:center;

    cursor:pointer;
    user-select:none;
}

.circle:active{
    transform:scale(.94);
}

.mine{
    color:#e5b83f;
    font-weight:bold;
    font-size:18px;
}

.number{
    font-size:42px;
    font-weight:bold;
    margin:8px;
}

.small{
    color:#777;
    font-size:11px;
}

.capacity{
    color:#aaa;
}

.bar{
    width:280px;
    height:10px;
    background:#222;
    border-radius:20px;
    margin:10px auto;
    overflow:hidden;
}

.fill{
    height:100%;
    width:100%;
    background:#e5b83f;
}
</style>
</head>

<body>

<h2>
TOTAL CP:
<span id="cp">0</span>
</h2>

<div
    class="circle"
    onclick="mineCP()"
>

    <div>◉</div>

    <div class="mine">
        MINE
    </div>

    <div
        id="left"
        class="number"
    >
        1000
    </div>

    <div class="small">
        CP AVAILABLE
    </div>

</div>

<div class="capacity">
    CAPACITY:
    <span id="capacity">1000</span>
    / 1000
</div>

<div class="bar">
    <div
        id="fill"
        class="fill"
    ></div>
</div>

<div id="message">
    Ready to mine
</div>


<script>

let cp = 0;
let mining = 1000;

function mineCP(){

    if(mining <= 0){

        document.getElementById("message").innerText =
        "Mining finished. Wait 1 hour.";

        return;
    }

    cp = cp + 1;
    mining = mining - 1;

    document.getElementById("cp").innerText =
    cp;

    document.getElementById("left").innerText =
    mining;

    document.getElementById("capacity").innerText =
    mining;

    document.getElementById("fill").style.width =
    (mining / 1000 * 100) + "%";

}

</script>

</body>
</html>
