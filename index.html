<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Arshan Coin</title>

  <style>
    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: Arial, Tahoma, sans-serif;
      background:
        radial-gradient(circle at top, #202020 0%, #090909 45%, #000 100%);
      color: white;
      text-align: center;
      overflow-x: hidden;
    }

    .app {
      width: 100%;
      max-width: 500px;
      min-height: 100vh;
      margin: auto;
      padding: 25px 18px 40px;
    }

    .title {
      font-size: 27px;
      font-weight: 900;
      letter-spacing: 1px;
      margin-top: 10px;
    }

    .subtitle {
      color: #aaa;
      font-size: 14px;
      margin-top: 6px;
    }

    .balance {
      margin: 25px auto 12px;
      padding: 14px 25px;
      width: fit-content;
      min-width: 190px;
      border: 1px solid #333;
      border-radius: 18px;
      background: rgba(255,255,255,.05);
      box-shadow: 0 8px 30px rgba(0,0,0,.35);
    }

    .balance-label {
      color: #aaa;
      font-size: 13px;
    }

    .balance-number {
      font-size: 29px;
      font-weight: 900;
      margin-top: 3px;
    }

    .coin-area {
      margin-top: 22px;
    }

    .coin {
      width: 220px;
      height: 220px;
      margin: auto;
      border-radius: 50%;
      border: 9px solid #8d6510;
      background:
        radial-gradient(circle at 35% 25%,
          #fff4a8 0%,
          #f5c94a 18%,
          #d99b18 45%,
          #8d5d08 72%,
          #3e2603 100%);
      box-shadow:
        0 0 0 5px #211602,
        0 15px 45px rgba(0,0,0,.8),
        0 0 45px rgba(242,184,42,.22),
        inset 0 0 25px rgba(255,255,255,.25);
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      cursor: pointer;
      user-select: none;
      transition: transform .08s ease;
      position: relative;
      overflow: hidden;
    }

    .coin::before {
      content: "";
      position: absolute;
      inset: 13px;
      border: 2px solid rgba(255,240,160,.55);
      border-radius: 50%;
    }

    .coin:active {
      transform: scale(.94);
    }

    .coin-name {
      font-size: 24px;
      font-weight: 1000;
      text-shadow: 0 2px 4px #5a3900;
      z-index: 1;
    }

    .coin-cp {
      font-size: 52px;
      font-weight: 1000;
      line-height: 1;
      margin: 8px 0;
      text-shadow: 0 3px 5px #573700;
      z-index: 1;
    }

    .coin-tap {
      font-size: 12px;
      font-weight: bold;
      z-index: 1;
    }

    .energy {
      margin: 22px auto 0;
      max-width: 350px;
    }

    .energy-text {
      display: flex;
      justify-content: space-between;
      color: #ddd;
      font-size: 14px;
      margin-bottom: 8px;
    }

    .bar {
      width: 100%;
      height: 13px;
      background: #242424;
      border-radius: 20px;
      overflow: hidden;
      border: 1px solid #333;
    }

    .bar-fill {
      height: 100%;
      width: 100%;
      background: linear-gradient(90deg, #b77b00, #ffd34d);
      border-radius: inherit;
      transition: width .15s ease;
    }

    .timer {
      margin-top: 9px;
      color: #e7b82d;
      font-size: 13px;
      min-height: 18px;
    }

    .shop {
      margin-top: 35px;
      text-align: right;
    }

    .shop-title {
      font-size: 21px;
      font-weight: 900;
      margin-bottom: 13px;
    }

    .shop-card {
      background: linear-gradient(145deg, #171717, #0c0c0c);
      border: 1px solid #303030;
      border-radius: 18px;
      padding: 17px;
      margin-bottom: 12px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }

    .shop-info {
      text-align: right;
    }

    .shop-name {
      font-size: 16px;
      font-weight: bold;
    }

    .shop-desc {
      color: #999;
      font-size: 12px;
      margin-top: 5px;
    }

    .buy {
      border: 0;
      border-radius: 12px;
      padding: 11px 15px;
      background: linear-gradient(135deg, #e6b62c, #9d6800);
      color: #111;
      font-weight: 900;
      cursor: pointer;
      white-space: nowrap;
    }

    .buy:active {
      transform: scale(.95);
    }

    .notice {
      margin-top: 20px;
      color: #777;
      font-size: 11px;
      line-height: 1.8;
    }

    .pop {
      position: fixed;
      pointer-events: none;
      font-weight: 900;
      color: #ffd84d;
      font-size: 22px;
      animation: pop .7s ease-out forwards;
      z-index: 999;
    }

    @keyframes pop {
      0% {
        opacity: 1;
        transform: translateY(0) scale(1);
      }
      100% {
        opacity: 0;
        transform: translateY(-75px) scale(1.3);
      }
    }

    @media (max-width: 380px) {
      .coin {
        width: 190px;
        height: 190px;
      }

      .coin-cp {
        font-size: 44px;
      }
    }
  </style>
</head>

<body>

<div class="app">

  <div class="title">🪙 ARSHAN COIN</div>
  <div class="subtitle">CP Mini App</div>

  <div class="balance">
    <div class="balance-label">موجودی شما</div>
    <div class="balance-number">
      <span id="balance">0</span> CP
    </div>
  </div>

  <div class="coin-area">

    <div class="coin" id="coin">
      <div class="coin-name">ARSHAN</div>
      <div class="coin-cp">CP</div>
      <div class="coin-tap">برای دریافت بزن</div>
    </div>

    <div class="energy">

      <div class="energy-text">
        <span>ظرفیت دریافت</span>
        <span>
          <b id="energy">1000</b> /
          <b id="maxEnergy">1000</b>
        </span>
      </div>

      <div class="bar">
        <div class="bar-fill" id="barFill"></div>
      </div>

      <div class="timer" id="timer"></div>

    </div>

  </div>

  <div class="shop">

    <div class="shop-title">🛒 فروشگاه تقویت</div>

    <div class="shop-card">
      <div class="shop-info">
        <div class="shop-name">⚡ Boost سطح ۱</div>
        <div class="shop-desc">
          ظرفیت دریافت را از 1000 به 1100 افزایش می‌دهد
        </div>
      </div>

      <button class="buy" onclick="buyBoost(100)">
        +100 ظرفیت
      </button>
    </div>

    <div class="shop-card">
      <div class="shop-info">
        <div class="shop-name">🔥 Boost سطح ۲</div>
        <div class="shop-desc">
          ظرفیت دریافت را از 1100 به 1250 افزایش می‌دهد
        </div>
      </div>

      <button class="buy" onclick="buyBoost(150)">
        +150 ظرفیت
      </button>
    </div>

  </div>

  <div class="notice">
    ظرفیت مصرف‌شده پس از گذشت زمان مشخص دوباره شارژ می‌شود.
  </div>

</div>

<script>

  const STORAGE_KEY = "arshan_coin_data";

  let data = JSON.parse(
    localStorage.getItem(STORAGE_KEY)
  ) || {
    balance: 0,
    maxEnergy: 1000,
    energy: 1000,
    rechargeStart: null
  };

  const balanceEl = document.getElementById("balance");
  const energyEl = document.getElementById("energy");
  const maxEnergyEl = document.getElementById("maxEnergy");
  const barFill = document.getElementById("barFill");
  const timerEl = document.getElementById("timer");
  const coin = document.getElementById("coin");

  function save() {
    localStorage.setItem(
      STORAGE_KEY,
      JSON.stringify(data)
    );
  }

  function updateUI() {

    balanceEl.textContent =
      data.balance.toLocaleString("en-US");

    energyEl.textContent =
      data.energy.toLocaleString("en-US");

    maxEnergyEl.textContent =
      data.maxEnergy.toLocaleString("en-US");

    const percent =
      (data.energy / data.maxEnergy) * 100;

    barFill.style.width =
      Math.max(0, percent) + "%";

    updateRecharge();
  }

  function collectCP(event) {

    if (data.energy <= 0) {
      return;
    }

    data.energy -= 1;
    data.balance += 1;

    if (data.energy === 0) {
      data.rechargeStart = Date.now();
    }

    createPop(event);

    save();
    updateUI();
  }

  function createPop(event) {

    const pop = document.createElement("div");

    pop.className = "pop";
    pop.textContent = "+1 CP";

    let x = window.innerWidth / 2;
    let y = window.innerHeight / 2;

    if (event && event.clientX) {
      x = event.clientX;
      y = event.clientY;
    }

    pop.style.left = x + "px";
    pop.style.top = y + "px";

    document.body.appendChild(pop);

    setTimeout(() => {
      pop.remove();
    }, 700);
  }

  function updateRecharge() {

    if (
      data.energy >= data.maxEnergy ||
      !data.rechargeStart
    ) {
      timerEl.textContent = "";
      return;
    }

    const oneHour = 60 * 60 * 1000;

    const passed =
      Date.now() - data.rechargeStart;

    const remaining =
      oneHour - passed;

    if (remaining <= 0) {

      data.energy = data.maxEnergy;
      data.rechargeStart = null;

      save();
      updateUI();

      return;
    }

    const minutes =
      Math.floor(remaining / 60000);

    const seconds =
      Math.floor((remaining % 60000) / 1000);

    timerEl.textContent =
      "شارژ کامل در " +
      String(minutes).padStart(2, "0") +
      ":" +
      String(seconds).padStart(2, "0");

  }

  function buyBoost(amount) {

    /*
      فعلاً Boost رایگان است تا ظاهر فروشگاه را تست کنیم.
      بعداً قیمت واقعی را به CP یا Arshan Coin وصل می‌کنیم.
    */

    data.maxEnergy += amount;
    data.energy += amount;

    save();
    updateUI();

    alert(
      "Boost فعال شد!\nظرفیت جدید: " +
      data.maxEnergy
    );
  }

  coin.addEventListener(
    "click",
    collectCP
  );

  setInterval(
    updateRecharge,
    1000
  );

  updateUI();

</script>

</body>
</html>
